            problem: "EA SEED の PB-MPM（Position-Based MPM, SIGGRAPH 2024）は、砂・雪・泥・粘弾性体をリアルタイムに扱える Material Point Method を、位置ベースの制約ループに作り直した手法。任意のタイムステップでも破綻せず、実装も比較的シンプルなのが特徴。ただし公開されているのは WebGPU の研究実装で、ネイティブ GPU（DirectX / Vulkan）での再現はほとんど無い。論文とブラウザデモを見るだけでは、自分のゲームの土台に使えるかどうかまでは分からなかったので、まず自分の環境で動かしてみることにした。",
            approach: "公式の WebGPU / WGSL 実装（BSD-3-Clause）を、式だけでなく行単位で忠実に DirectX 12 / HLSL へ翻訳した（過去に式だけ移植して挙動が合わず失敗した反省から）。粒子→グリッド→粒子を 1 ディスパッチに融合した g2p2g、6×6+ハロ1 のタイル（bukkit）への粒子再ビン、3 枚の格子のリングローテーション、GPU 側エミッション ── 公式アーキテクチャをそのまま移植している。結果、液体・弾性・砂・粘体の 4 材質が、砂は粒として積もり／液体は広がり／弾性体は形を保つ、と別々の物性として 60fps・1.7 万粒子で安定して解ける。移植で効いたのは自作エンジンの決定論リプレイ（同じ入力なら bit-exact）で、グリッド書き込み順に起因する非決定性を差分として炙り出せた。DX12 / HLSL 固有の罠も複数踏んだ ── 例えば HLSL の atan2(0,0) が NaN を返し、無変形の弾性体で 2×2 SVD が壊れて「粒子が空中で凍結」する（WGSL は 0 を返すので公式では起きない）／未初期化ディスクリプタがテーブル内にあるだけでデバイスロスト、など。この『一本のソルバから複数の物性が出る』のが面白く、後の落ちものパズル制作につながった。EA の移植部は BSD-3-Clause に従い帰属表示の上で利用している。",

        {

            tags: ["DirectX 11", "VRM", "VMD", "TAA", "Frame Generation"],
            meta: "2026 | DirectX 11 スタンドアロンデモ",
            problem: "物理シミュレーションは固定タイムステップで回し、表示はその間を補間する ── ゲームの定番構成。このとき画面に出した動きと、TAA やフレーム生成（DLSS3/FSR3 系）へ渡すモーションベクタ(MV)の申告が食い違う。「ティック由来の MV」「MV=0」「提示状態由来の MV」のどれを申告するかで後段の画がどう変わるかは、まとまった資料が少ない。",
            approach: "DX11 のスタンドアロンデモを書き、VRM モデルに VMD ダンスを CPU スキニングで再生。画面を左右に分割して MV の申告方法だけを変え、TAA / 簡易フレーム生成 / MV 可視化の 3 ビューで比較した。決定的な CPU 計測ハーネスも併設。結果はネガティブ寄りだったが、そこも含めて書いておく。(1) 近傍クランプ付き TAA は MV の嘘をほぼ吸収する（実測でほぼフラット）。(2) フレーム生成はクランプが無いので嘘を素通しし、過大 MV はスカートや脚の破断・振動、MV=0 は実効 fps 半減のガタつきとして直撃する。(3) 大手エンジンの標準経路では提示状態由来の MV は事実上実装済みで、嘘が残るのはレンダラが変形を追跡しない場所（Unity Cloth の MV=0、GPU パーティクル、カスタムコンピュート変形など）。数値では、提示 MV はティック MV 比で再投影残差 −86%、ジャダー指標は最新値提示の 1/65。",
            media: [

            links: [

        },
        {
            id: "npr-temporal",
            title: "トゥーン輪郭線の時間安定化",
            thumb: "images/npr/toon_compare_alicia.webp", thumbW: 968, thumbH: 320,
            blurb: "3D から自動生成した輪郭線はアニメでチラつく。TAA の考え方（motion vector 再投影）を輪郭線チャネルに応用して安定化してみた。VRM 比較ビューアと、風で揺れる布のリアルタイムデモ付き。",
            tags: ["NPR", "TAA", "物理シム", "C++20"],
            meta: "2026 | MitiruEngine",
            problem: "screen-space で抽出した輪郭線（深度段差・法線の折れ）は、カメラやモデルが動くとフレームごとに線が明滅・分断されてチラつく。特に布のシワのような「変形で動的に生まれる線」は、定番の背面法では原理的に描けず、テクスチャにも事前に描けないため、screen-space 検出が唯一の手段になる。",
            approach: "TAA と同じく motion vector で前フレームの線を再投影し、objectId で「同じ物体の線か」を検証してから合成。G-buffer の velocity / objectId チャネル、前フレーム保持、変形メッシュ用の per-vertex velocity、安定化パス（CPU/GPU）までエンジンに一式実装。デモは VRM モデルのターンテーブル比較と、Verlet 布 + ランダム突風のリアルタイム Game DLL の 2 本。チラつき −63% などの数値は自動テストで固定。",
            media: [

                { type: "video", src: "images/npr/cloth_demo.webm",
                  caption: "布のシワ線（72f ループ）。左: 背面法のみ（開いたメッシュでは外形線すら出ない）/ 中: +シワ線（無安定化）/ 右: +安定化。リアルタイム版は Game DLL として実装、Space で突風。" },
                { type: "img", src: "images/npr/flicker_heatmap.webp", w: 1292, h: 180,
                  alt: "チラつきヒートマップの before/after",
                  caption: "チラつきの可視化（フレーム間の再投影残差）。赤が明滅成分。左 2 枚が輪郭線、右 2 枚がヒートマップ（無対策 → 安定化）。" }
            ],
            code: {
                caption: "安定化の核（dropout-filling）: くっきり出ている線は触らず、「前フレームに線があり、近くで線が生きている」瞬間的な欠落だけを補填する。",
                snippet:
`// raw がくっきり出ている画素はそのまま（線をぼかさない）
if (raw[i] >= p.fillThreshold) continue;

// motion vector で前フレームの対応位置へ
float sx = x - velocity.x, sy = y - velocity.y;
if (!inScreen(sx, sy)) continue;
if (prevObjectId(sx, sy) != objectId(x, y)) continue; // 別物体の履歴は使わない

float hist = bilinear(prevStable, sx, sy);
if (hist < p.histThreshold) continue;            // 前フレームに線が無い
if (neighborMaxRaw(x, y) < p.supportThreshold)   // 線が死んでいる
    continue;

// 瞬間的な欠落だけを減衰付きで補填（消えた線は数フレームでフェード）
out[i] = max(raw[i], hist * p.decay);`,

    }

    function openModal(lab, opener) {
        lastOpener = opener || null;
        const media = lab.media.map(m => m.type === "video"

            : `<img class="media" src="${m.src}" alt="${m.alt || ""}"${m.w ? ` width="${m.w}" height="${m.h}"` : ""} loading="lazy">
               <div class="media-caption">${m.caption}</div>`
        ).join("");
        const code = lab.code ? `
            <div class="m-block" style="margin-top: 1.6rem;"><b>コード</b><p>${lab.code.caption}</p></div>
            <pre><code>${escapeHtml(lab.code.snippet)}</code></pre>
            <div class="link-row" style="margin-top: 0.8rem;">${lab.code.links.map(l =>
                `<a href="${l.href}" target="_blank" rel="noopener">${l.label} →</a>`).join("")}</div>` : "";
        const links = lab.links ? `
            <div class="link-row">${lab.links.map(l =>
                `<a href="${l.href}" target="_blank" rel="noopener">${l.label} →</a>`).join("")}</div>` : "";
        const more = lab.more
            ? `<div class="link-row"><a href="${lab.more}">もっと詳しく →</a></div>` : "";
        content.innerHTML = `
            <h2>${lab.title}</h2>
            <div class="m-meta">${lab.meta}</div>
            <div class="m-block"><b>問題</b><p>${lab.problem}</p></div>
            <div class="m-block"><b>アプローチ</b><p>${lab.approach}</p></div>
            ${media}${code}${links}${more}`;
        panel.setAttribute("aria-label", lab.title);
        overlay.classList.add("open");
        document.body.style.overflow = "hidden";
        closeBtn.focus();
    }
    function closeModal() {
        overlay.classList.remove("open");
        content.innerHTML = ""; // 動画停止
        document.body.style.overflow = "";
        if (lastOpener) { lastOpener.focus(); lastOpener = null; }
    }
    closeBtn.addEventListener("click", closeModal);
    overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
    document.addEventListener("keydown", e => {
        if (!overlay.classList.contains("open")) return;
        if (e.key === "Escape") { closeModal(); return; }
        if (e.key !== "Tab") return;
        // focus trap: モーダル内の最初/最後の要素で折り返す
        const focusables = panel.querySelectorAll(
            'button, a[href], video, [tabindex]:not([tabindex="-1"])');
        if (!focusables.length) return;
        const first = focusables[0];
        const last = focusables[focusables.length - 1];
        if (e.shiftKey && document.activeElement === first) {
            e.preventDefault(); last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault(); first.focus();
        }
    });
    </script>

    <script src="assets/js/back-to-top.js"></script>
</body>

</html>
